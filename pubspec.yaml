name: ledgerx
description: Flutter offline-first ledger app with GetX, SQLite, AES encryption, and comprehensive features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management, Routing, DI
  get: ^4.6.6
  
  # Database
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # CSV Import/Export
  csv: ^5.1.1
  
  # File Picker
  file_picker: ^6.1.1
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Date/Time
  intl: ^0.18.1
  
  # Shared Preferences
  shared_preferences: ^2.2.2
  
  # Charts for visualization
  fl_chart: ^0.65.0
  
  # Share functionality
  share_plus: ^7.2.1
  
  # Permission handling
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
