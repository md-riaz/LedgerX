name: ledgerx
description: Flutter offline-first ledger app with GetX, SQLite, AES encryption, and comprehensive features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management, Routing, DI
  get: ^4.6.6
  
  # Database
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # CSV Import/Export
  csv: ^6.0.0
  
  # File Picker
  file_picker: ^10.3.3

  # File saving across platforms
  file_saver: ^0.3.1
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Date/Time
  intl: ^0.20.2
  
  # Shared Preferences
  shared_preferences: ^2.2.2
  
  # Charts for visualization
  fl_chart: ^1.1.1
  
  # Share functionality
  share_plus: ^12.0.1
  
  # Permission handling
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
